name: Shen mod CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    # Runtime assets target the Windows game client. Pillow's LANCZOS/quantize
    # rounding differs across OS wheels, so strict byte reproducibility is
    # intentionally checked on the real target platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python mods/lol_mod/tools/build_lol_mod.py
      - run: python mods/lol_mod/tools/validate_lol_mod.py
      - run: python -m pytest -q
      - name: Generated files are committed
        run: git diff --exit-code -- mods/lol_mod/aseprite_resources mods/lol_mod/icons mods/lol_mod/qa/shen_actor_contact_final.png mods/lol_mod/qa/shen_skill_icons_final.png mods/lol_mod/build_manifest.json
