name: League champion mod CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    # Runtime assets target the Windows game client. Pillow's LANCZOS/quantize
    # rounding differs across OS wheels, so strict byte reproducibility is
    # intentionally checked on the real target platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Download and verify official Teamfight Manager 2 SDK 0.5.1
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "tfm2-sdk-0.5.1.zip"
          $package = Join-Path $env:RUNNER_TEMP "tfm2-sdk-0.5.1"
          Invoke-WebRequest -Uri "https://github.com/teamsamoyed/TeamfightManager2Mod/releases/download/0.5.1/0.5.1.zip" -OutFile $archive
          $expected = "5d3ee5b104f65501629e7f905d327c1f57d86ca5cabc1717bf456a2287a0f08a"
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Official SDK archive hash mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $sdk = Join-Path $package "mod-sdk"
          if (-not (Test-Path -LiteralPath (Join-Path $sdk "base_version.txt") -PathType Leaf)) {
            throw "Official SDK archive did not contain mod-sdk/base_version.txt"
          }
          "TFM2_MOD_SDK_DIR=$sdk" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile native DLL against the pinned official SDK
        shell: pwsh
        run: |
          rustup toolchain install nightly-2026-05-24 --profile minimal
          ./mods/lol_mod/tools/build_native_dll.ps1 -SdkDir $env:TFM2_MOD_SDK_DIR -OutDll (Join-Path $env:RUNNER_TEMP "lol_mod-ci.dll")
      - run: python mods/lol_mod/tools/build_lol_mod.py
      - name: Runtime reference closure and non-panicking DLL gates
        run: python -m pytest -q tests/test_runtime_reference_closure.py
      - run: python mods/lol_mod/tools/validate_lol_mod.py
      - name: Portrait surface and crop regression gates
        run: python -m pytest -q tests/test_yone_portrait_ci.py
      - run: python -m pytest -q
      - name: Generated actor, effects, icons, BP, fullbody, QA audit, and manifest are committed
        run: >-
          git diff --exit-code --
          mods/lol_mod/aseprite_resources
          mods/lol_mod/icons
          'mods/lol_mod/aseprite_resources/champions/kled#anim.fanim'
          'mods/lol_mod/aseprite_resources/champions/kled#sheet.png'
          'mods/lol_mod/aseprite_resources/effects/kled_q_tether#anim.fanim'
          'mods/lol_mod/aseprite_resources/effects/kled_q_tether#sheet.png'
          'mods/lol_mod/aseprite_resources/effects/kled_e_joust#anim.fanim'
          'mods/lol_mod/aseprite_resources/effects/kled_e_joust#sheet.png'
          'mods/lol_mod/aseprite_resources/effects/kled_r_trail#anim.fanim'
          'mods/lol_mod/aseprite_resources/effects/kled_r_trail#sheet.png'
          'mods/lol_mod/aseprite_resources/effects/kled_r_impact#anim.fanim'
          'mods/lol_mod/aseprite_resources/effects/kled_r_impact#sheet.png'
          mods/lol_mod/icons/kled_skill.png
          mods/lol_mod/icons/kled_skill2.png
          mods/lol_mod/icons/kled_ult.png
          mods/lol_mod/champion/archer.data_champion
          mods/lol_mod/champion/barrier_magician.data_champion
          mods/lol_mod/champion/berserker.data_champion
          mods/lol_mod/champion/boomerang_hunter.data_champion
          mods/lol_mod/sound/sfx/sivir_native_silence.sound_info
          mods/lol_mod/sound/sfx/sivir_native_silence_clip.wav
          mods/lol_mod/BanPickIllust/cavalry_knight.png
          mods/lol_mod/BanPickIllust/dual_blader.png
          mods/lol_mod/ui/champion_fullbody/cavalry_knight.png
          mods/lol_mod/ui/champion_fullbody/dual_blader.png
          mods/lol_mod/ui/champion_portrait/dual_blader_compact.png
          mods/lol_mod/ui/champion_portrait/dual_blader_grid.png
          mods/lol_mod/qa/shen_actor_contact_final.png
          mods/lol_mod/qa/shen_skill_icons_final.png
          mods/lol_mod/qa/lucian_actor_contact_final.png
          mods/lol_mod/qa/lucian_skill_icons_final.png
          mods/lol_mod/qa/lucian_vfx_contact_final.png
          mods/lol_mod/qa/orianna_actor_contact_final.png
